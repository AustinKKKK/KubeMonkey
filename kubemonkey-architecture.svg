<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b87d4b"/>
    </marker>
  </defs>

  <style>
    .card { fill: #211913; stroke: #3a2d23; stroke-width: 1.5; }
    .title { font-weight: 700; font-size: 20px; fill: #f2ebe1; }
    .stage-label { font-weight: 700; font-size: 17px; fill: #e8b565; }
    .desc { font-size: 12.5px; fill: #a4907c; }
    .code { font-family: monospace; font-size: 11px; fill: #f2ebe1; }
    .arrow-line { stroke: #b87d4b; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    .cycle-label { font-family: monospace; font-size: 11px; fill: #a4907c; }
  </style>

  <rect x="0" y="0" width="800" height="420" fill="#17110d"/>

  <text x="40" y="42" class="title">KubeMonkey — Cycle Architecture</text>
  <text x="40" y="64" class="desc">runs once per tick (default every 30s)</text>

  <!-- Ticker -->
  <circle cx="70" cy="140" r="34" class="card"/>
  <text x="70" y="136" text-anchor="middle" class="stage-label" font-size="13">time</text>
  <text x="70" y="152" text-anchor="middle" class="stage-label" font-size="13">.Ticker</text>

  <path d="M104,140 H160" class="arrow-line"/>

  <!-- Lister -->
  <rect x="160" y="90" width="150" height="100" rx="10" class="card"/>
  <text x="235" y="122" text-anchor="middle" class="stage-label">Lister</text>
  <text x="235" y="144" text-anchor="middle" class="desc">clientset.CoreV1()</text>
  <text x="235" y="160" text-anchor="middle" class="desc">.Pods(ns).List()</text>
  <text x="235" y="178" text-anchor="middle" class="code">→ []corev1.Pod</text>

  <path d="M310,140 H366" class="arrow-line"/>

  <!-- Filter -->
  <rect x="366" y="90" width="150" height="100" rx="10" class="card"/>
  <text x="441" y="122" text-anchor="middle" class="stage-label">Filter</text>
  <text x="441" y="144" text-anchor="middle" class="desc">whitelist check</text>
  <text x="441" y="160" text-anchor="middle" class="desc">allowedNamespaces</text>
  <text x="441" y="178" text-anchor="middle" class="code">→ []corev1.Pod</text>

  <path d="M516,140 H572" class="arrow-line"/>

  <!-- Killer -->
  <rect x="572" y="90" width="180" height="100" rx="10" class="card"/>
  <text x="662" y="122" text-anchor="middle" class="stage-label">Killer</text>
  <text x="662" y="144" text-anchor="middle" class="desc">rand.Intn(len)</text>
  <text x="662" y="160" text-anchor="middle" class="desc">Pods(ns).Delete()</text>
  <text x="662" y="178" text-anchor="middle" class="code">→ error | nil</text>

  <!-- dry-run branch -->
  <rect x="572" y="220" width="180" height="46" rx="8" fill="none" stroke="#a4907c" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="662" y="240" text-anchor="middle" class="desc">if dryRun:</text>
  <text x="662" y="256" text-anchor="middle" class="desc">log only, no Delete()</text>

  <!-- allowed / blocked namespaces -->
  <text x="235" y="230" text-anchor="middle" class="cycle-label" fill="#83b06b">✓ default</text>
  <text x="235" y="248" text-anchor="middle" class="cycle-label" fill="#d0715f">✗ kube-system</text>
  <text x="235" y="266" text-anchor="middle" class="cycle-label" fill="#d0715f">✗ local-path-storage</text>

  <!-- self-healing loop back -->
  <path d="M662,190 C662,320 235,340 90,300 C40,285 40,190 70,174"
        fill="none" stroke="#3a2d23" stroke-width="1.5" stroke-dasharray="3 4" marker-end="url(#arrow)"/>
  <text x="380" y="335" text-anchor="middle" class="desc">k8s replaces the killed pod → replica count restored → next tick</text>

  <text x="40" y="400" class="cycle-label">Lister → Filter → Killer, repeated every -interval until stopped</text>
</svg>
